spring:
  ai:
    # === Anthropic 原生 API 配置 ===
    # 启用时设置 claude-code.provider=anthropic
    anthropic:
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:https://api.anthropic.com}
      chat:
        options:
          model: ${AI_MODEL:claude-sonnet-4-20250514}
          max-tokens: ${AI_MAX_TOKENS:8096}
          temperature: 0.7

    # === OpenAI 兼容 API 配置 ===
    # 启用时设置 claude-code.provider=openai（默认）
    # 支持 OpenAI、Azure OpenAI、兼容 API 代理等
    openai:
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o}

  # 纯 SDK 模式：不启动嵌入式 Web 服务器
  main:
    web-application-type: none
    banner-mode: off

  # 虚拟线程
  threads:
    virtual:
      enabled: true

# === HMS Core SDK 配置 ===
hms-core:
  # API 提供者：openai 或 anthropic
  provider: ${HMS_CORE_PROVIDER:openai}

  # 会话管理
  session:
    idle-timeout-minutes: 30
    cleanup-interval-minutes: 5

  # 指标收集
  metrics:
    enabled: true
    flush-interval-seconds: 60

# 日志
logging:
  level:
    root: WARN
    com.inspirationi: INFO
    org.springframework: WARN
