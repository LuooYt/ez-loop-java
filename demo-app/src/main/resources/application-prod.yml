# === 生产环境配置 ===
#
# 密钥与端点一律通过环境变量注入，本文件不得出现任何真实值：
#   export AI_API_KEY=sk-...             # 必填，缺失则启动即失败
#   export AI_BASE_URL=https://...       # 可选，默认按 provider 取官方端点
#   export AI_MODEL=...                  # 可选，默认见下方注释
#   export HMS_CORE_PROVIDER=anthropic   # 或 openai

hms-core:
  provider: ${HMS_CORE_PROVIDER:anthropic}

  session:
    idle-timeout-minutes: 30
    cleanup-interval-minutes: 5
    # 同时存活的会话数上限。每个会话持有独立的消息历史与工具副本，
    # 无上限时失控的 createSession() 会耗尽堆内存。
    max-sessions: 1000

  # 单轮对话内 Agent 循环的最大迭代次数（一次工具调用 + 一次模型响应算一轮）。
  # 撞上限会截断回答并追加警告标记 —— 长工具链任务可上调，但每轮迭代都是一次
  # 付费 API 调用，配太大会让跑偏的循环烧掉大量额度。
  max-iterations: 50

  # 等待用户回答 AskUser 提问或权限确认的上限（秒），超时按拒绝处理。
  # 需容纳真人的思考与操作时间；配太小会让正常的人工确认被误判为拒绝。
  user-response-timeout-seconds: 300

  # ── 上下文窗口与压缩阈值 ──
  #
  # 有效窗口 = context-window - reserved-tokens
  # 压缩阈值 = 有效窗口 × 93%，判据是最近一次请求的 prompt token 数
  #（不是累计用量 —— 累计几十万也不会触发，这是正确设计）
  #
  # context-window 应与实际所用模型的窗口一致：
  #   配小了 → 过早压缩，白花摘要费用、还丢上下文
  #   配大了 → 压缩来不及，请求超限被上游直接拒绝
  # reserved-tokens 留给模型输出与压缩摘要本身，必须显著小于窗口，
  # 否则有效窗口归零、占用率恒为 0，压缩永不触发。
  #
  # 想在本地观察压缩行为，把 context-window 调到 60000 即可：
  # 有效窗口 40000、阈值 37200，几轮长对话就能触及（基线提示词约 5.8K）。
  context-window: 200000
  reserved-tokens: 20000

  # 提示词国际化：HMS 启动时检测系统语言，中文系统直接用内置中文提示词，
  # 非中文系统通过大模型自动翻译。设为 false 则始终使用中文提示词。
  i18n:
    enabled: true

  # 生产必须校验证书。放宽校验只用于本机/内网自建中转，见 InsecureTlsConfiguration
  # 的 Javadoc —— 它默认关闭，这里显式写出以防被其他 profile 带开。
  tls:
    insecure: false

spring:
  ai:
    # Anthropic 原生 API（HMS_CORE_PROVIDER=anthropic 时生效）
    #
    # 注意：Spring AI 2.0.1 的 AnthropicChatProperties 前缀是
    # spring.ai.anthropic.chat，字段是扁平的 model / max-tokens —— 没有
    # options 这一层。写成 chat.options.model 绑定不上，会静默回落到
    # AnthropicChatOptions.DEFAULT_MODEL（claude-haiku-4-5）。
    anthropic:
      # 无默认值：AI_API_KEY 未设置时启动即报错，避免带着占位符跑到生产
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://api.anthropic.com}
      chat:
        # claude-opus-4-8 是当前最强的 Opus 档模型。其他可选：
        # claude-sonnet-4-6（速度与成本更均衡）、claude-haiku-4-5（最快最便宜）。
        model: ${AI_MODEL:claude-opus-4-8}
        max-tokens: ${AI_MAX_TOKENS:8096}
        # 不设 temperature：Opus 4.8 / 4.7 已移除采样参数，传了会被服务端 400
        # 拒绝（top-p / top-k 同理）。输出风格改用提示词约束。

    # OpenAI 兼容 API（HMS_CORE_PROVIDER=openai 时生效，也可对接兼容代理）
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      # 同 anthropic：前缀是 spring.ai.openai.chat，字段扁平，无 options 层
      chat:
        model: ${AI_MODEL:gpt-4o}
        max-tokens: ${AI_MAX_TOKENS:8096}
        temperature: 0.7
