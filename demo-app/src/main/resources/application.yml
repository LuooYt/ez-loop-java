# === HMS Web Demo 公共配置 ===
#
# 本文件只放与环境无关的配置，**不得写入任何密钥或真实端点**。
# 密钥与端点按 profile 分离：
#   application-dev.yml   本地调试，未纳入版本管理（见 .gitignore）
#   application-prod.yml  生产，全部通过环境变量注入
#
# 切换 profile：
#   java -jar app.jar --spring.profiles.active=prod
#   或 export SPRING_PROFILES_ACTIVE=prod

spring:
  profiles:
    # 默认走 dev，避免本地误连生产端点；部署时用环境变量覆盖为 prod
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    web-application-type: servlet
    banner-mode: console

  threads:
    virtual:
      enabled: true

  web:
    resources:
      static-locations: classpath:/static/

server:
  port: ${SERVER_PORT:8088}

hms-core:
  session:
    idle-timeout-minutes: 30
    cleanup-interval-minutes: 5
    # 同时存活的会话数上限。每个会话持有独立的消息历史与工具副本，
    # 无上限时失控的 createSession() 会耗尽堆内存。
    max-sessions: 1000

  # 单轮对话内 Agent 循环的最大迭代次数（一次工具调用 + 一次模型响应算一轮）。
  # 撞上限会截断回答并追加警告标记 —— 长工具链任务可上调，但每轮迭代都是一次
  # 付费 API 调用，配太大会让跑偏的循环烧掉大量额度。
  max-iterations: 50

  # 等待用户回答 AskUser 提问或权限确认的上限（秒），超时按拒绝处理。
  # 需容纳真人的思考与操作时间；配太小会让正常的人工确认被误判为拒绝。
  user-response-timeout-seconds: 300

  # ── 上下文窗口与压缩阈值 ──
  #
  # 有效窗口 = context-window - reserved-tokens
  # 压缩阈值 = 有效窗口 × 93%，判据是最近一次请求的 prompt token 数
  #（不是累计用量 —— 累计几十万也不会触发，这是正确设计）
  #
  # context-window 是「模型能吃多少」的声明，必须与实际所用模型的真实窗口一致，
  # 不要当成「我想在多少 token 时压缩」的旋钮：
  #   配大了 → 压缩来不及，请求超限被上游直接拒绝
  #   配小了 → core 在远未真正超限时就判定超载（日志会出现 >100% 的占用率），
  #            反复发起压缩。而 SessionMemory / Full 两层压缩都要把这段历史
  #            发给模型做摘要 —— 历史对上游其实完全合法，压缩即使成功也是白压，
  #            失败则纯属浪费（实测每轮卡 130 秒以上，直至请求超时）。
  #
  # reserved-tokens 留给模型输出与压缩摘要本身，必须显著小于窗口，
  # 否则有效窗口归零、占用率恒为 0，压缩永不触发。
  #
  # 想在本地观察压缩行为，调大 reserved-tokens 而不是调小 context-window，
  # 例如 170000：有效窗口 30000、阈值 27900，几轮长对话就能触及
  #（基线提示词约 5.8K），且摘要请求本身仍在模型窗口内、能正常完成。
  context-window: 200000
  reserved-tokens: 20000

  # 提示词国际化：HMS 启动时检测系统语言，中文系统直接用内置中文提示词，
  # 非中文系统通过大模型自动翻译。设为 false 则始终使用中文提示词。
  i18n:
    enabled: true

  # 跳过 TLS 证书与主机名校验。仅用于自签证书或经 IP 直连上游的调试场景 ——
  # 开启后中间人攻击无法被发现，生产环境务必保持 false。
  tls:
    insecure: false

logging:
  level:
    root: WARN
    com.inspirationi: INFO
    org.springframework: WARN
