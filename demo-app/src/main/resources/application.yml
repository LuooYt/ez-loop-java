# === HMS Web Demo 配置 ===

# 密钥与端点一律通过环境变量注入，不要把真实值写进本文件。
#   export AI_API_KEY=sk-...            # 必填
#   export AI_BASE_URL=https://...      # 可选，默认按 provider 取官方端点
#   export AI_MODEL=...                 # 可选
#   export HMS_CORE_PROVIDER=anthropic  # 或 openai
spring:
  ai:
    # Anthropic 原生 API（HMS_CORE_PROVIDER=anthropic 时生效）
    anthropic:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: ${AI_BASE_URL:https://api.anthropic.com}
      chat:
        options:
          model: ${AI_MODEL:claude-sonnet-4-20250514}
          max-tokens: ${AI_MAX_TOKENS:8096}
          temperature: 0.7
    # OpenAI 兼容 API（HMS_CORE_PROVIDER=openai 时生效，也可对接兼容代理）
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o}
          max-tokens: ${AI_MAX_TOKENS:8096}
          temperature: 0.7

  main:
    web-application-type: servlet
    banner-mode: console

  threads:
    virtual:
      enabled: true

  web:
    resources:
      static-locations: classpath:/static/

# === HMS Core SDK 配置 ===
hms-core:
  provider: ${HMS_CORE_PROVIDER:anthropic}

  session:
    idle-timeout-minutes: 30
    cleanup-interval-minutes: 5

  # 提示词国际化：HMS 启动时检测系统语言（Windows/Linux），
  # 中文系统直接使用内置中文提示词；非中文系统通过大模型自动翻译内置提示词。
  # 设为 false 可关闭翻译（始终使用中文提示词）。
  i18n:
    enabled: true

server:
  port: ${SERVER_PORT:8088}

logging:
  level:
    root: WARN
    com.inspirationi: INFO
    org.springframework: WARN
