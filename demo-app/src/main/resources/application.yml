# === HMS Web Demo 公共配置 ===
#
# 本文件只放与环境无关的配置，**不得写入任何密钥或真实端点**。
# 密钥与端点按 profile 分离：
#   application-dev.yml   本地调试，未纳入版本管理（见 .gitignore）
#   application-prod.yml  生产，全部通过环境变量注入
#
# 切换 profile：
#   java -jar app.jar --spring.profiles.active=dev
#   或 export SPRING_PROFILES_ACTIVE=dev

hms-core:
  sandbox:
    # 沙箱总开关。关闭时不注册全部文件类工具。
    enabled: ${HMS_SANDBOX_ENABLED:true}
    # 沙箱根目录：每个会话在其下拥有独立的 <sessionId>/ 子目录。
    root: ${HMS_SANDBOX_ROOT:./sandbox}
    # 会话销毁/空闲回收时是否删除会话沙箱目录（默认保留产出）。
    cleanup-on-destroy: ${HMS_SANDBOX_CLEANUP:false}
    max-file-bytes: 10485760
    bash:
      timeout-seconds: 120
      max-output-chars: 40000

spring:
  profiles:
    # 默认走 prod：application-dev.yml 未纳入版本管理，新克隆的仓库里并不存在，
    # 默认 dev 会因为找不到密钥与端点而启动失败。prod 全部读环境变量，缺什么
    # 报什么，是更可诊断的默认值。本地调试请显式指定 dev。
    active: ${SPRING_PROFILES_ACTIVE:prod}

  main:
    web-application-type: servlet
    banner-mode: console

  threads:
    virtual:
      enabled: true

  web:
    resources:
      static-locations: classpath:/static/

server:
  port: ${SERVER_PORT:8088}
  # 监听地址默认只绑回环。本 demo 没有鉴权，一旦监听 0.0.0.0 就等于把「执行命令 +
  # 读写沙箱文件」的能力开放给整个局域网 —— 同网段任何人不需要任何凭证即可操作。
  # 真要对外演示，走容器编排（demo-app/deploy/docker-compose.yml 显式设
  # SERVER_ADDRESS=0.0.0.0，且外层有反向代理/端口绑定收敛）。
  address: ${SERVER_ADDRESS:127.0.0.1}

# === demo 专属护栏 ===
# 这些开关只影响 demo，不影响 hms-core 的权限语义。
hms:
  demo:
    # 是否允许通过 API 切到 BYPASS。BYPASS 会让所有工具跳过确认直接执行，
    # 对一个无鉴权的演示服务来说等于「任意访客可远程执行任意命令」，
    # 因此默认关闭；需要演示时用环境变量显式打开。
    allow-bypass: ${HMS_DEMO_ALLOW_BYPASS:false}
    # 允许跨域调用 /api/** 的来源（逗号分隔，支持 [*] 端口通配）。
    # 默认只放行本机；对公网演示请显式列出自己的域名。
    cors-origins: ${HMS_DEMO_CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

logging:
  level:
    root: WARN
    com.inspirationi: INFO
    org.springframework: WARN
